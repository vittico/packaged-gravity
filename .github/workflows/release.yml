name: Release

# Publishes a GitHub Release whenever a version tag is pushed, e.g.:
#
#     git tag v1.0 && git push origin v1.0
#
# The release carries auto-generated notes plus GitHub's source archives. It does
# NOT attach built .rpm/.deb/.AppImage files, because building them requires
# Google's proprietary Antigravity tarball, which users download and run through
# ./build.sh themselves (see README).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required for gh release create

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so release notes can diff from the last tag

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
